name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:pack
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  lowest:
    # The oldest releases the peer ranges allow: @langchain/core 1.2.16 is the first
    # with `ns` and `stampRetryable` in @langchain/core/errors; @langchain/langgraph 1.2.6
    # and langchain 1.3.0 are the oldest that pass the middleware tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # langchain depends on @langchain/langgraph itself; without overrides pnpm keeps a
      # second, newer copy for it, and interrupts no longer resume.
      - run: pnpm add -D @langchain/core@1.2.16 @langchain/langgraph@1.2.6 langchain@1.3.0
      - run: |
          printf 'overrides:\n  "@langchain/core": 1.2.16\n  "@langchain/langgraph": 1.2.6\n' >> pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
      - run: node scripts/check-single-copy.mjs 1.2.16 1.2.6
      - run: pnpm test

  node20:
    # The test tooling needs Node 22+, so on Node 20 the built package is installed
    # into a fresh project and imported from ESM and CommonJS, as a user would.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/smoke-pack.mjs

  live:
    # Contract tests against prod Drex; skipped when the secrets aren't available (forks).
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      NACE_API_KEY_LIVE: ${{ secrets.NACE_API_KEY_LIVE }}
      NACE_API_KEY: ${{ secrets.NACE_API_KEY_LIVE }}
      OPENROUTER_API_KEY_LIVE: ${{ secrets.OPENROUTER_API_KEY_LIVE }}
      # Real LLMs drive the agent tests (Claude; gpt-oss-120b for the misbehaving-agent test).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
      - run: pnpm build
      # The examples call Drex for real, so they need the key (absent until the secret is set).
      - if: ${{ env.NACE_API_KEY != '' }}
        run: npx tsx examples/support-agent.ts
      - if: ${{ env.NACE_API_KEY != '' }}
        run: npx tsx examples/langgraph-router.ts
